name: Build & Deploy to GCP Cloud Run (staging)

# Auto-deploys staging on push to main; also runnable manually. Modelled on
# Exakairos/mirai-platform's pipeline. Prod is intentionally not wired yet —
# copy the deploy-staging job to a deploy-prod job with prod Variables/secrets
# and a gated `environment: production` when you're ready.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REGISTRY: asia-southeast1-docker.pkg.dev
  AR_REPO: finsight
  # envsubst allowlist for the backend manifest — keeps any stray `$foo` in the
  # YAML from being silently blanked. Add new backend env vars here + in the
  # deploy step's env: block + backend-staging.yaml.
  BACKEND_ENVSUBST_ALLOWLIST: '$IMAGE $GIT_COMMIT $CLIENT_URL $PGHOST $PGPORT $PGUSER $PGDATABASE $MINIO_BUCKET $GOOGLE_CLIENT_ID'

jobs:
  # ── Build & push both images ────────────────────────────────────
  build:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            build_args: ""
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            # Vite bakes these into the browser bundle at build time (not
            # secrets — they ship to every browser). Staging values from repo
            # Variables. VITE_API_URL must point at the staging backend URL.
            build_args: |
              VITE_API_URL=${{ vars.STAGING_VITE_API_URL }}
              VITE_GOOGLE_CLIENT_ID=${{ vars.STAGING_VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: ${{ matrix.build_args }}

  # ── Deploy → staging ────────────────────────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    # Serialize deploys so back-to-back pushes can't race on the same service.
    concurrency:
      group: finsight-deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend → staging
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          CLIENT_URL: ${{ vars.STAGING_CLIENT_URL }}
          PGHOST: ${{ vars.STAGING_PGHOST }}
          PGPORT: ${{ vars.STAGING_PGPORT || '5432' }}
          PGUSER: ${{ vars.STAGING_PGUSER }}
          PGDATABASE: ${{ vars.STAGING_PGDATABASE }}
          MINIO_BUCKET: ${{ vars.STAGING_GCS_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ vars.STAGING_GOOGLE_CLIENT_ID }}
        run: |
          envsubst "$BACKEND_ENVSUBST_ALLOWLIST" < infra/cloudrun/backend-staging.yaml > /tmp/backend-staging.yaml
          gcloud run services replace /tmp/backend-staging.yaml --region=${{ env.REGION }} --quiet
          gcloud run services add-iam-policy-binding finsight-backend-staging \
            --region=${{ env.REGION }} --member=allUsers --role=roles/run.invoker --quiet

      - name: Deploy frontend → staging
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}
        run: |
          envsubst '$IMAGE' < infra/cloudrun/frontend-staging.yaml > /tmp/frontend-staging.yaml
          gcloud run services replace /tmp/frontend-staging.yaml --region=${{ env.REGION }} --quiet
          gcloud run services add-iam-policy-binding finsight-frontend-staging \
            --region=${{ env.REGION }} --member=allUsers --role=roles/run.invoker --quiet

      - name: Print service URLs
        run: |
          echo "Backend:  $(gcloud run services describe finsight-backend-staging  --region=${{ env.REGION }} --format='value(status.url)')"
          echo "Frontend: $(gcloud run services describe finsight-frontend-staging --region=${{ env.REGION }} --format='value(status.url)')"
