# Cloud Run service — finsight frontend (staging).
#
# The frontend is a static bundle served by `serve`; all real config (API URL,
# Google client id) is baked into the JS at BUILD time via VITE_* build args in
# the workflow, so this manifest only needs the image. Applied the same way as
# the backend: envsubst fills ${IMAGE}, then `gcloud run services replace`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finsight-frontend-staging
  labels:
    cloud.googleapis.com/location: asia-southeast1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          # nginx reverse-proxies /api to this backend origin (see nginx.conf.template).
          env:
            - name: BACKEND_ORIGIN
              value: ${BACKEND_ORIGIN}
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 10
            tcpSocket:
              port: 8080
  traffic:
    - latestRevision: true
      percent: 100
